<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг Воспитателей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a2e1a;
      color: #ffffff;
      margin: 0;
      padding: 15px;
    }
    h1 {
      text-align: center;
      color: #ccff00;
      font-size: 22px;
    }
    .card {
      background: #2a402a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info h2 {
      margin: 0 0 5px 0;
      font-size: 18px;
    }
    .elo {
      color: #ccff00;
      font-weight: bold;
    }
    .btn {
      background: #ccff00;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🎾 Рейтинг Воспитателей</h1>

  <div class="card">
    <div class="info">
      <h2>Nasiba Kodirovna</h2>
      <div class="elo">Рейтинг Elo: 1000</div>
    </div>
    <button class="btn" onclick="alert('Голос за Nasiba Kodirovna принят!')">Оценить</button>
  </div>

  <div class="card">
    <div class="info">
      <h2>Sevara Aminovna</h2>
      <div class="elo">Рейтинг Elo: 1000</div>
    </div>
    <button class="btn" onclick="alert('Голос за Sevara Aminovna принят!')">Оценить</button>
  </div>

  <div class="card">
    <div class="info">
      <h2>Feruza Akzamovna</h2>
      <div class="elo">Рейтинг Elo: 1000</div>
    </div>
    <button class="btn" onclick="alert('Голос за Feruza Akzamovna принят!')">Оценить</button>
  </div>

  <div class="card">
    <div class="info">
      <h2>Shahlo Ismailovna</h2>
      <div class="elo">Рейтинг Elo: 1000</div>
    </div>
    <button class="btn" onclick="alert('Голос за Shahlo Ismailovna принят!')">Оценить</button>
  </div>

</body>
</html>
