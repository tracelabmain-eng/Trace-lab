<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг Воспитателей</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121811;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ccff00;
            font-size: 22px;
            margin-bottom: 20px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background-color: #1e261d;
            border: 1px solid #2d3b2b;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .name {
            font-weight: bold;
            font-size: 16px;
        }
        .elo {
            color: #ccff00;
            font-size: 14px;
        }
        .btn {
            background-color: #ccff00;
            color: #000000;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>🎾 Рейтинг Воспитателей</h1>
    <div class="container" id="staff-list">Загрузка данных...</div>

    <script>
        const SUPABASE_URL = 'https://onkujrlrrtraxiassmqh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KbJ4S1m1yt1zM6jtyM8UQw_FOJmqGe4';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchStaff() {
            const { data, error } = await supabaseClient
                .from('staff')
                .select('*')
                .order('elo', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки:', error);
                return;
            }

            const listContainer = document.getElementById('staff-list');
            listContainer.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="info">
                        <div class="name">${item.name}</div>
                        <div class="elo">Рейтинг Elo: ${item.elo}</div>
                    </div>
                    <button class="btn" onclick="vote(${item.id}, ${item.elo})">Оценить</button>
                `;
                listContainer.appendChild(card);
            });
        }

        async function vote(id, currentElo) {
            const newElo = currentElo + 15;
            const { error } = await supabaseClient
                .from('staff')
                .update({ elo: newElo })
                .eq('id', id);

            if (error) {
                alert('Ошибка при сохранении голоса');
            } else {
                fetchStaff();
            }
        }

        fetchStaff();
    </script>
</body>
</html>
