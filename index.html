<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг Воспитателей</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; margin: 0; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h3 { margin: 0 0 5px 0; color: #333; }
    .elo { font-size: 18px; font-weight: bold; color: #007bff; margin-bottom: 10px; }
    input[type="text"] { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-plus { background: #28a745; color: white; margin-right: 5px; }
    .btn-minus { background: #dc3545; color: white; }
    .admin-btn { position: fixed; top: 10px; right: 10px; opacity: 0.5; background: #000; color: #fff; border: none; padding: 6px 12px; border-radius: 5px; font-size: 12px; }
    .admin-status { color: #d9534f; font-weight: bold; margin-bottom: 10px; display: none; background: #fdf7f7; padding: 8px; border: 1px solid #d9534f; border-radius: 5px; }
    .modal { display: none; position: fixed; top: 5%; left: 5%; width: 85%; height: 85%; background: white; z-index: 1000; padding: 20px; border: 2px solid #000; overflow-y: auto; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .user-info { font-size: 12px; color: #666; margin-bottom: 15px; }
  </style>
</head>
<body>

  <!-- Кнопка Админки -->
  <button class="admin-btn" onclick="openAdminPanel()">⚙️ Admin</button>

  <h2>Рейтинг Воспитателей</h2>
  <div id="user-display" class="user-info">Авторизация...</div>
  <div id="admin-indicator" class="admin-status">👑 Режим Администратора (КД отключён)</div>
  
  <div id="staff-list">Загрузка данных...</div>

  <!-- Модальное окно Админки -->
  <div id="admin-modal" class="modal">
    <h2>🔒 Админ-Панель</h2>
    <button onclick="closeAdminPanel()" style="background: #333; color: #fff; margin-bottom: 15px;">❌ Выйти из Админки</button>
    <hr>
    <h3>Установить Elo вручную</h3>
    <input type="number" id="admin-staff-id" placeholder="ID (Севара = 2)" style="width: 120px;">
    <input type="number" id="admin-new-elo" placeholder="Новый Elo" style="width: 150px;">
    <button onclick="setStaffElo()" style="background: #007bff; color: white;">Сохранить</button>
    <hr>
    <h3>Отзывы на модерации</h3>
    <div id="pending-comments"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://onkujrlrrtraxiassmqh.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_KbJ4S1m1yt1zM6jtyM8UQw_FOJmqGe4';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tg = window.Telegram?.WebApp;
    tg?.expand();

    // Данные из Telegram
    const tgUser = tg?.initDataUnsafe?.user;
    const currentUserId = tgUser ? String(tgUser.id) : "pc_dev_user_1";
    
    // Авто-определение ника
    let autoNickname = "Пользователь";
    if (tgUser) {
      if (tgUser.first_name) autoNickname = tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "");
      else if (tgUser.username) autoNickname = "@" + tgUser.username;
    }

    let currentUser = null;
    let isAdmin = false;

    window.addEventListener('DOMContentLoaded', async () => {
      await initUser();
      await loadStaff();
    });

    // Авторизация без prompt
    async function initUser() {
      let { data: user } = await supabaseClient
        .from('users')
        .select('*')
        .eq('telegram_id', currentUserId)
        .maybeSingle();

      if (!user) {
        const { data: newUser, error: createError } = await supabaseClient
          .from('users')
          .insert([{ 
            telegram_id: currentUserId, 
            nickname: autoNickname 
          }])
          .select()
          .single();

        if (createError) {
          currentUser = { telegram_id: currentUserId, nickname: autoNickname, last_vote_time: null };
        } else {
          currentUser = newUser;
        }
      } else {
        currentUser = user;
      }

      document.getElementById('user-display').innerText = `Вы вошли как: ${currentUser.nickname}`;
    }

    // Загрузка списка воспитателей
    async function loadStaff() {
      const { data: staff, error } = await supabaseClient.from('staff').select('*').order('id');
      const container = document.getElementById('staff-list');
      
      if (error) {
        container.innerHTML = `<p style="color:red"><b>Ошибка доступа к базе!</b><br>Проверьте, отключен ли RLS у таблиц в Supabase.</p>`;
        return;
      }

      container.innerHTML = '';
      if (staff && staff.length > 0) {
        staff.forEach(s => {
          container.innerHTML += `
            <div class="card">
              <h3>${s.name}</h3>
              <div class="elo">Elo: ${s.elo}</div>
              <input type="text" id="comment-${s.id}" placeholder="Напишите отзыв (мин. 10 символов)..." autocomplete="off">
              <div>
                <button class="btn-plus" onclick="sendVote(${s.id}, 'лайк')">+15 Elo</button>
                <button class="btn-minus" onclick="sendVote(${s.id}, 'дизлайк')">-15 Elo</button>
              </div>
            </div>
          `;
        });
      } else {
        container.innerHTML = '<p>Список воспитателей пуст.</p>';
      }
    }

    // Отправка голоса и комментария
    async function sendVote(staffId, type) {
      if (!currentUser) await initUser();

      const input = document.getElementById(`comment-${staffId}`);
      const commentText = input ? input.value.trim() : "";

      if (!commentText || commentText.length < 10) {
        alert("Пожалуйста, напишите отзыв минимум из 10 символов!");
        return;
      }

      // Проверка КД
      if (!isAdmin && currentUser.last_vote_time) {
        const lastVote = new Date(currentUser.last_vote_time).getTime();
        const diffSeconds = Math.floor((new Date().getTime() - lastVote) / 1000);

        if (diffSeconds < 300) {
          const wait = 300 - diffSeconds;
          alert(`Подождите еще ${Math.floor(wait / 60)} мин ${wait % 60} сек перед следующим голосом.`);
          return;
        }
      }

      const { error: commentErr } = await supabaseClient.from('comments').insert([{
        teacher_id: staffId,
        user_nickname: currentUser.nickname + (isAdmin ? " [ADMIN]" : ""),
        text: `[${type}] ${commentText}`,
        status: 'pending'
      }]);

      if (commentErr) {
        alert("Ошибка при отправке отзыва! Проверьте таблицу 'comments'.");
        return;
      }

      const nowISO = new Date().toISOString();
      await supabaseClient.from('users').update({ last_vote_time: nowISO }).eq('telegram_id', currentUserId);
      currentUser.last_vote_time = nowISO;

      if (input) input.value = "";
      alert(isAdmin ? "Отзыв отправлен без КД (как Админ)!" : "Отзыв отправлен на модерацию!");
    }

    // Админка
    function openAdminPanel() {
      const pass = prompt("Введи пароль админа:");
      if (pass !== "admin123") {
        alert("Неверный пароль!");
        return;
      }

      isAdmin = true;
      document.getElementById('admin-indicator').style.display = 'block';
      document.getElementById('admin-modal').style.display = 'block';
      loadPendingComments();
    }

    function closeAdminPanel() {
      isAdmin = false;
      document.getElementById('admin-indicator').style.display = 'none';
      document.getElementById('admin-modal').style.display = 'none';
      alert("Вы вышли из админ-панели. Режим КД снова включён.");
    }

    async function setStaffElo() {
      const id = document.getElementById('admin-staff-id').value;
      const newElo = document.getElementById('admin-new-elo').value;

      if (!id || !newElo) return alert("Заполните оба поля!");

      const { error } = await supabaseClient.from('staff').update({ elo: parseInt(newElo) }).eq('id', parseInt(id));
      
      if (error) {
        alert("Ошибка сохранения! Проверьте RLS таблицы 'staff'.");
      } else {
        alert("Рейтинг обновлён!");
        loadStaff();
      }
    }

    async function loadPendingComments() {
      const { data: comments } = await supabaseClient.from('comments').select('*').eq('status', 'pending');
      const container = document.getElementById('pending-comments');
      container.innerHTML = comments && comments.length ? '' : '<p>Нет отзывов на проверке</p>';

      if (comments) {
        comments.forEach(c => {
          container.innerHTML += `
            <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 8px; border-radius: 5px;">
              <p style="margin:2px 0;"><b>Ник:</b> ${c.user_nickname}</p>
              <p style="margin:2px 0;"><b>Текст:</b> ${c.text}</p>
              <div style="margin-top: 8px;">
                <button onclick="approveComment(${c.id}, ${c.teacher_id}, 15)" style="background:green; color:white;">✅ +15 Elo</button>
                <button onclick="approveComment(${c.id}, ${c.teacher_id}, -15)" style="background:orange; color:white;">✅ -15 Elo</button>
                <button onclick="rejectComment(${c.id})" style="background:red; color:white;">❌ Отклонить</button>
              </div>
            </div>
          `;
        });
      }
    }

    async function approveComment(commentId, staffId, eloDelta) {
      await supabaseClient.from('comments').update({ status: 'approved' }).eq('id', commentId);
      const { data: s } = await supabaseClient.from('staff').select('elo').eq('id', staffId).single();
      if (s) {
        await supabaseClient.from('staff').update({ elo: s.elo + eloDelta }).eq('id', staffId);
      }
      loadPendingComments();
      loadStaff();
    }

    async function rejectComment(commentId) {
      await supabaseClient.from('comments').update({ status: 'rejected' }).eq('id', commentId);
      loadPendingComments();
    }
  </script>
</body>
</html>
